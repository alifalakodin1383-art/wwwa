<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوت‌نامه</title>
    <style>
        :root {
            --primary-color: #ff4d6d;
            --secondary-color: #ff758f;
            --bg-color: #fff0f3;
            --text-color: #590d22;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Tahoma', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-color);
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.2);
            position: relative;
            z-index: 10;
        }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.5s ease-in-out; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 1.6rem; margin-bottom: 20px; }
        
        .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Tahoma', sans-serif;
        }

        .btn-yes { background-color: var(--primary-color); color: white; }
        .btn-yes:hover { transform: scale(1.1); background-color: #ff0040; }

        /* استایل دکمه فرار */
        .btn-run { 
            background-color: #ffb3c1; 
            color: var(--text-color); 
            position: absolute; 
            transition: all 0.2s ease;
        }

        input {
            width: 80%; padding: 12px;
            border: 2px solid var(--secondary-color);
            border-radius: 10px; margin-bottom: 20px;
            outline: none; text-align: center;
        }

        .heart {
            position: absolute; color: var(--primary-color);
            font-size: 20px; pointer-events: none;
            animation: floatUp 3s linear forwards;
        }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100vh); opacity: 0; } }
    </style>
</head>
<body>

    <div class="container">
        <!-- صفحه ۱ -->
        <div id="screen1" class="screen active">
            <h1>ترنج جان... ❤️</h1>
            <p>می‌شه بریم بیرون؟ 😊</p>
            <div class="btn-group">
                <button class="btn-yes" onclick="nextScreen(2)">بله!</button>
                <button id="noBtn1" class="btn-run" onmouseenter="runButton('noBtn1')" ontouchstart="runButton('noBtn1')">نه</button>
            </div>
        </div>

        <!-- صفحه ۲ -->
        <div id="screen2" class="screen">
            <h1>ایول! 😍</h1>
            <p>کجا دوست داری بریم؟</p>
            <input type="text" id="placeInput" placeholder="مثلاً کافه یا پارک...">
            <div class="btn-group">
                <button class="btn-yes" onclick="finish()">تایید</button>
                <button id="noBtn2" class="btn-run" onmouseenter="runButton('noBtn2')" ontouchstart="runButton('noBtn2')">نمی‌دونم!</button>
            </div>
        </div>

        <!-- صفحه ۳ -->
        <div id="screen3" class="screen">
            <h1>عالیه! ✨</h1>
            <p>منتظر خبرت هستم... ❤️</p>
        </div>
    </div>

    <script>
        function nextScreen(num) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen' + num).classList.add('active');
        }

        // تابع عمومی برای فرار دکمه‌ها
        function runButton(id) {
            const btn = document.getElementById(id);
            const maxX = window.innerWidth - btn.offsetWidth - 20;
            const maxY = window.innerHeight - btn.offsetHeight - 20;
            
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;
            
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
            
            // تغییر متن‌های تصادفی
            const texts = ["مطمئنی؟", "واقعاً؟", "فکر کن!", "دوباره فکر کن!", "نهههه", "نمی‌شه که!"];
            btn.innerText = texts[Math.floor(Math.random() * texts.length)];
        }

        function finish() {
            const place = document.getElementById('placeInput').value;
            if(!place) { alert("لطفاً یک مکان بنویس ❤️"); return; }
            nextScreen(3);
            
            // تولید قلب
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 3000);
            }, 150);
        }
    </script>
</body>
</html>
